version: 2
updates:
  # Actions used by the workflows.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  # The server and panel bundle. Majors (zod 4, vitest, esbuild) are planned by hand
  # (docs/ROADMAP.md), so only minor and patch updates open PRs here.
  - package-ecosystem: npm
    directory: /server
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # esbuild is 0.x, so its "minor" releases can break the panel bundle: upgrade it by
      # hand (rebuild the bundle, run scripts/check-bundle.cjs on Node 17.7.2). Patches still come.
      - dependency-name: "esbuild"
        versions: [">=0.29.0"]
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
