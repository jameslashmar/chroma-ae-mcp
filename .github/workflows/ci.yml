name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Build, test, lint
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install
        working-directory: server
        run: npm ci

      - name: Build
        working-directory: server
        run: npm run build

      - name: Unit tests
        working-directory: server
        run: npm test

      - name: ExtendScript lint (ES3, no chained ternaries)
        run: node scripts/lint-jsx.mjs

      - name: Panel bundle is up to date
        working-directory: server
        run: |
          npm run bundle
          git diff --exit-code -- ../panel/client/mcp-bundle.cjs

  cep-node:
    # AE 26's CEP panels run Node v17.7.2 (measured 2026-10-27 over the panel's
    # debug port). The MCP server runs inside the panel, so its bundle must work there.
    name: Panel MCP on AE's CEP Node (17.7.2)
    needs: test
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 17.7.2

      - name: MCP end to end against a fake AE
        run: |
          node --version
          node scripts/check-bundle.cjs
