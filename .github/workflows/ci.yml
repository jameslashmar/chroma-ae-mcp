name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A new push to the same PR cancels the run still going; main always runs to the end.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    # macOS is new to CI (the tool has not been run on a Mac yet): it reports but
    # doesn't fail the build until it has been green for a while.
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]
        node: [20, 22, 24]
        experimental: [false]
        include:
          - os: macos-latest
            node: 22
            experimental: true
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install
        working-directory: server
        run: npm ci

      - name: Build
        working-directory: server
        run: npm run build

      - name: Unit tests
        if: ${{ !(matrix.os == 'windows-latest' && matrix.node == 22) }}
        working-directory: server
        run: npm test

      - name: Unit tests with coverage baseline
        if: matrix.os == 'windows-latest' && matrix.node == 22
        working-directory: server
        run: npm run test:coverage

      - name: ExtendScript lint (ES3, no chained ternaries)
        run: node scripts/lint-jsx.mjs

      - name: Panel bundle is up to date
        working-directory: server
        run: |
          npm run bundle
          git diff --exit-code -- ../panel/client/mcp-bundle.cjs

      - name: Coverage report
        if: always() && matrix.os == 'windows-latest' && matrix.node == 22
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: server/coverage/
          if-no-files-found: ignore
          retention-days: 14

  audit:
    # Fails on critical advisories in what ships in the panel (runtime dependencies).
    # Everything else, dev tools included, is listed in the job summary without failing.
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Full audit (report only)
        working-directory: server
        run: |
          {
            echo '## npm audit'
            echo '```'
            npm audit || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Shipped dependencies, critical only
        working-directory: server
        run: npm audit --omit=dev --audit-level=critical

  cep-node:
    # AE 26's CEP panels run Node v17.7.2 (measured 2026-10-27 over the panel's
    # debug port). The MCP server runs inside the panel, so its bundle must work there.
    name: Panel MCP on AE's CEP Node (17.7.2)
    needs: test
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 17.7.2

      - name: MCP end to end against a fake AE
        run: |
          node --version
          node scripts/check-bundle.cjs
