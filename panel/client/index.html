<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Chroma AE MCP</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <header class="header">
    <h1 class="title">This session</h1>
    <span id="status-badge" class="badge" title="">
      <span class="badge-dot" aria-hidden="true"></span><span id="status-text">Starting</span><span id="ae-version" class="badge-host"></span>
    </span>
  </header>

  <div id="update-bar" class="update-bar" hidden>
    <div class="update-text">
      <span id="update-title" class="update-title"></span>
      <span id="update-status" class="update-status" role="status" aria-live="polite"></span>
    </div>
    <button id="update-notes" class="btn-link" type="button" title="Open the release notes in your browser">What's new</button>
    <button id="update-btn" class="btn btn-primary btn-small" type="button">Update</button>
  </div>

  <section id="ask" class="ask" hidden>
    <div class="ask-head">
      <span class="ask-title">Claude asks</span>
      <span id="ask-more" class="ask-more"></span>
    </div>
    <div id="ask-question" class="ask-question"></div>
    <div id="ask-context" class="ask-context"></div>
    <div id="ask-options" class="ask-options"></div>
    <div id="ask-editor" class="ask-editor" hidden>
      <svg id="ask-editor-svg" class="ask-editor-svg" viewBox="0 0 200 200" aria-label="Curve editor"></svg>
      <div class="ask-editor-side">
        <div class="ask-editor-hint">Drag the handles to adjust.</div>
        <div id="ask-curve-value" class="ask-curve-value"></div>
        <div class="ask-track"><span id="ask-editor-dot" class="ask-dot"></span></div>
      </div>
    </div>
    <input id="ask-other" class="ask-other" type="text" placeholder="Or type your own answer" />
    <div class="ask-actions">
      <button id="ask-send" class="btn btn-primary" type="button" disabled>Send</button>
      <button id="ask-dismiss" class="btn" type="button">Skip</button>
      <span id="ask-status" class="ask-status"></span>
    </div>
  </section>

  <div id="top" class="top">
    <div class="tiles tiles-3">
      <div class="tile"><div class="tile-label">Tool calls</div><div id="stat-calls" class="tile-value">0</div></div>
      <div class="tile"><div class="tile-label">Queued</div><div id="queue-depth" class="tile-value">0</div></div>
      <div class="tile" id="tile-errors"><div class="tile-label">Errors</div><div id="stat-errors" class="tile-value">0</div></div>
    </div>
    <div class="tiles tiles-2">
      <div class="tile"><div class="tile-label">Median reply</div><div class="tile-value"><span id="stat-median">–</span><span class="tile-unit"> ms</span></div></div>
      <div class="tile"><div class="tile-label">Checkpoints</div><div id="stat-checkpoints" class="tile-value">0</div></div>
    </div>

    <div class="chart-card">
      <div class="chart-head"><span>Reply time, last 20 calls</span><span id="chart-max"></span></div>
      <div id="chart" class="chart" role="img" aria-label="No tool calls yet"></div>
      <div id="chart-note" class="chart-note">No tool calls yet.</div>
    </div>

    <div class="register">
      <button id="register-toggle" class="register-toggle" type="button" aria-expanded="true" aria-controls="register-body">
        <svg class="chev" width="9" height="9" viewBox="0 0 10 10" aria-hidden="true"><path d="M2.5 1 7.5 5 2.5 9z" fill="currentColor"></path></svg>
        Register with<span id="register-summary" class="register-summary"></span>
      </button>
      <div id="register-body" class="register-body">
        <div id="register-clients" class="register-clients" role="radiogroup" aria-label="AI to set up"></div>
        <button id="copy-setup-btn" class="btn btn-primary btn-wide" type="button">Copy setup command</button>
        <div id="setup-where" class="setup-where"></div>
      </div>
      <span id="inflight-label" class="inflight" title="The call After Effects is running now"></span>
    </div>
  </div>

  <section id="log-section" class="log-section">
    <div class="log-bar">
      <button id="log-toggle" class="log-toggle" type="button" aria-expanded="false" aria-controls="log-body">
        <svg class="chev" width="9" height="9" viewBox="0 0 10 10" aria-hidden="true"><path d="M2.5 1 7.5 5 2.5 9z" fill="currentColor"></path></svg>
        Log<span id="log-count" class="log-count">0</span>
      </button>
      <button id="log-full" class="log-expand" type="button" aria-pressed="false" aria-label="Fill the panel" title="Fill the panel">
        <svg class="icon-expand" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"></path></svg>
        <svg class="icon-collapse" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5"></path></svg>
      </button>
    </div>
    <div id="log-body" class="log-body" hidden>
      <div id="log-entries" class="log-entries">
        <div class="log-empty">Nothing yet. Tool calls from Claude show up here.</div>
      </div>
      <details class="raw-log">
        <summary><svg class="chev" width="9" height="9" viewBox="0 0 10 10" aria-hidden="true"><path d="M2.5 1 7.5 5 2.5 9z" fill="currentColor"></path></svg>Raw log<span id="raw-count" class="log-count"></span></summary>
        <div id="log" class="log" role="log" aria-live="polite"></div>
      </details>
    </div>
  </section>

  <footer class="minor-actions">
    <button id="regen-token-btn" class="btn-link" type="button" title="Make a new Bearer token">New token</button>
    <button id="clear-render-lock-btn" class="btn-link" type="button" hidden title="Only if After Effects is no longer rendering: lets the other tools reach it again">Clear render lock</button>
    <button id="diagnostics-btn" class="btn-link" type="button" title="Save versions, queue, popups and the log to one file">Save diagnostics</button>
    <button id="update-check-btn" class="btn-link" type="button" title="Look for a newer release on GitHub">Check for updates</button>
  </footer>

  <script src="./common.js"></script>
  <script src="./panel.js"></script>
</body>
</html>
