<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Chroma AE MCP</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <header class="header">
    <div class="title-row">
      <span class="title">Chroma AE MCP</span>
      <span id="status-badge" class="badge">starting</span>
    </div>
    <div class="meta-grid">
      <div class="meta-item">
        <span class="meta-label">Listen</span>
        <span id="port-value" class="meta-value">127.0.0.1:7790</span>
      </div>
      <div class="meta-item">
        <span class="meta-label">Host</span>
        <span id="ae-version" class="meta-value">AE —</span>
      </div>
      <div class="meta-item">
        <span class="meta-label">In-Flight</span>
        <span id="inflight-label" class="meta-value">idle</span>
      </div>
      <div class="meta-item">
        <span class="meta-label">Queue</span>
        <span id="queue-depth" class="meta-value">0</span>
      </div>
    </div>
    <div class="setup-box">
      <div id="setup-command" class="setup-command">claude mcp add --scope user --transport http chroma-ae http://127.0.0.1:7790/mcp --header "Authorization: Bearer ••••••••"</div>
      <div class="setup-actions">
        <button id="copy-setup-btn" class="btn btn-primary" type="button">Copy setup command</button>
        <button id="regen-token-btn" class="btn" type="button">Regenerate token</button>
      </div>
    </div>
  </header>

  <section id="ask" class="ask" hidden>
    <div class="ask-head">
      <span class="ask-title">Claude asks</span>
      <span id="ask-more" class="ask-more"></span>
    </div>
    <div id="ask-question" class="ask-question"></div>
    <div id="ask-context" class="ask-context"></div>
    <div id="ask-options" class="ask-options"></div>
    <div id="ask-editor" class="ask-editor" hidden>
      <svg id="ask-editor-svg" class="ask-editor-svg" viewBox="0 0 200 200" aria-label="Curve editor"></svg>
      <div class="ask-editor-side">
        <div class="ask-editor-hint">Drag the handles to adjust.</div>
        <div id="ask-curve-value" class="ask-curve-value"></div>
        <div class="ask-track"><span id="ask-editor-dot" class="ask-dot"></span></div>
      </div>
    </div>
    <input id="ask-other" class="ask-other" type="text" placeholder="Or type your own answer" />
    <div class="ask-actions">
      <button id="ask-send" class="btn btn-primary" type="button" disabled>Send</button>
      <button id="ask-dismiss" class="btn" type="button">Skip</button>
      <span id="ask-status" class="ask-status"></span>
    </div>
  </section>

  <main class="log-container">
    <div id="log" class="log" role="log" aria-live="polite"></div>
  </main>

  <script src="./common.js"></script>
  <script src="./panel.js"></script>
</body>
</html>
